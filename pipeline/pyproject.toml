[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "chat-pipeline"
version = "0.1.0"
description = "Corpus -> chunks -> vectors for the portfolio chatbot"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "openai>=1.40",
    "pydantic>=2.7",  # the Chunk model
    "python-dotenv>=1.0",
    "pyyaml>=6.0",    # corpus/sources.yaml
    "qdrant-client>=1.12",
]

[project.scripts]
chat-pipeline = "chat_pipeline.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/chat_pipeline"]
