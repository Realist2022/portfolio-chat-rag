# A uv workspace with two members, shaped like an earlier client project but in one repo:
#
#   pipeline/   builds the index: corpus -> chunks -> vectors (phase 1)
#   backend/    the FastAPI chat service Cloud Run runs; it only reads the index
#
# `uv sync` builds one .venv from uv.lock for both.

[project]
name = "portfolio-chat-rag"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["chat-backend", "chat-pipeline"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["backend", "pipeline"]

[tool.uv.sources]
chat-backend = { workspace = true }
chat-pipeline = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "pipeline/tests"]

[tool.ruff.lint.isort]
known-first-party = ["app", "chat_pipeline"]
